[project]
name = "aurora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.3.0",
    "gcsfs>=2025.3.0",
    "h5py>=3.16.0",
    "jax>=0.10.0",
    "lightning>=2.6.1",
    "microsoft-aurora>=1.8.0",
    "mslk>=0.0.0",
    "netcdf4>=1.7.4",
    "pyshtools>=4.14.1",
    "stormer",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torch-harmonics==0.8.0",
    "torchao>=0.17.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "xarray>=2026.4.0",
    "xformers>=0.0.35",
    "zarr>=3.2.1",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.workspace]
members = [
    "stormer",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
